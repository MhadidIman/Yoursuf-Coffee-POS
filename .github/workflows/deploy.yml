name: Deploy ke cPanel DomaiNesia

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Upload Perubahan ke Hosting
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Kode Terbaru
      uses: actions/checkout@v4

    - name: Kirim File via FTP ke DomaiNesia
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          vendor/**
          .env
          storage/**
          bootstrap/cache/**